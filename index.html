<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Storm Catch</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Vazirmatn:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#5a4570; --blue:#ff9ecb; --yellow:#ffce54; --red:#ff6b6b; --green:#54d18a; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%; overscroll-behavior:none;}
  body{
    font-family:'Vazirmatn','Baloo 2',sans-serif; color:var(--ink);
    background:linear-gradient(180deg,#ffe1f2,#f3e3ff 55%,#e8d9ff);
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
    overflow:hidden; -webkit-user-select:none; user-select:none;
  }
  .stage{ position:relative; width:min(94vw,440px); aspect-ratio:9/16; max-height:92vh; border-radius:24px; overflow:hidden; touch-action:none;
    box-shadow:0 0 0 6px #fff, 0 28px 60px -18px rgba(60,110,160,.45); }
  canvas{display:block; width:100%; height:100%;}

  .hud{position:absolute; top:14px; left:14px; right:14px; display:flex; justify-content:space-between; z-index:5; font-family:'Baloo 2',sans-serif; pointer-events:none;}
  .pill{background:rgba(255,255,255,.9); border-radius:20px; padding:6px 16px; font-weight:700; font-size:18px; color:#c94fa8; box-shadow:0 3px 10px rgba(180,90,170,.2);}
  .best{font-size:11px; color:#a06fb0; margin-top:4px; font-family:'Vazirmatn',sans-serif; text-align:left;}
  .lives{font-size:18px;}

  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:14px; padding:30px; z-index:10;
    background:linear-gradient(180deg,rgba(255,225,242,.97),rgba(232,217,255,.98));
  }
  .overlay h1{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:30px; color:#c94fa8; text-shadow:0 2px 0 #fff;}
  .overlay p{color:#7c5f92; font-size:14px; line-height:1.8; max-width:280px;}
  .stat-row{display:flex; gap:24px; margin:2px 0 6px;}
  .stat b{display:block; font-family:'Baloo 2',sans-serif; font-size:26px; color:#c94fa8;}
  .stat span{font-size:11px; color:#a06fb0;}
  button{
    font-family:'Vazirmatn',sans-serif; font-weight:700; font-size:15px; border:none; border-radius:14px;
    padding:13px 28px; cursor:pointer; background:linear-gradient(135deg,#ff9ecb,#c9a0ff); color:#fff;
    box-shadow:0 8px 20px -6px rgba(200,100,190,.6);
  }
  button.ghost{background:#fff; color:#c94fa8; box-shadow:none; border:1px solid #f5d0ea;}
  .btnrow{display:flex; gap:10px;}
  .hint{position:absolute; bottom:16px; left:0; right:0; text-align:center; font-size:12px; color:#9a5fa8; z-index:5; font-weight:600;}
  .copied{position:absolute; bottom:64px; left:50%; transform:translateX(-50%); background:#fff; color:#c94fa8; font-size:12px; padding:6px 16px; border-radius:20px; opacity:0; transition:opacity .25s; box-shadow:0 4px 12px rgba(180,90,170,.25);}
  .copied.show{opacity:1;}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hud">
    <div>
      <div class="pill" id="scoreLabel">🍔 0</div>
      <div class="best" id="bestLabel">رکورد: 0</div>
    </div>
    <div class="pill lives" id="livesLabel">❤️❤️❤️</div>
  </div>
  <div class="hint" id="hint">انگشتتو بکش چپ و راست تا ظرف حرکت کنه</div>
  <div class="copied" id="copiedToast">امتیاز کپی شد ✓</div>

  <div class="overlay" id="startOverlay">
    <h1>Food Storm Catch 🍕⛈️</h1>
    <p>یه طوفان غذا شروع شده! غذاهای خوشمزه رو با ظرف بگیر، از چیزای بد و خراب فرار کن. هرچی سرعتت بیشتر باشه امتیاز بیشتری می‌گیری!</p>
    <div class="btnrow"><button id="startBtn">بزن بریم</button></div>
  </div>

  <div class="overlay" id="overOverlay" style="display:none;">
    <h1 style="font-size:26px; color:#ff6b6b;">طوفان تموم شد 🌪️</h1>
    <div class="stat-row">
      <div class="stat"><b id="finalScore">0</b><span>امتیاز</span></div>
      <div class="stat"><b id="finalBest">0</b><span>رکورد</span></div>
    </div>
    <div class="btnrow">
      <button id="retryBtn">دوباره بازی کن</button>
      <button id="shareBtn" class="ghost">کپی امتیاز</button>
    </div>
  </div>
</div>

<script>
(function(){
  const stage=document.getElementById('stage');
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d');
  let W,H,DPR;
  function resize(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=stage.clientWidth; H=stage.clientHeight;
    canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize',resize); resize();

  const scoreLabel=document.getElementById('scoreLabel');
  const bestLabel=document.getElementById('bestLabel');
  const livesLabel=document.getElementById('livesLabel');
  const startOverlay=document.getElementById('startOverlay');
  const overOverlay=document.getElementById('overOverlay');
  const finalScore=document.getElementById('finalScore');
  const finalBest=document.getElementById('finalBest');
  const hint=document.getElementById('hint');
  const copiedToast=document.getElementById('copiedToast');

  let best=0; try{ best=parseInt(localStorage.getItem('foodstorm_best')||'0',10); }catch(e){}
  bestLabel.textContent='رکورد: '+best;

  // pre-render soft glow sprites once (cheaper than building a gradient every frame)
  function makeGlowSprite(hue, alpha){
    const s=document.createElement('canvas'); s.width=64; s.height=64;
    const sc=s.getContext('2d');
    const g=sc.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,`rgba(${hue},${alpha})`); g.addColorStop(1,`rgba(${hue},0)`);
    sc.fillStyle=g; sc.beginPath(); sc.arc(32,32,32,0,7); sc.fill();
    return s;
  }
  const glowPink = makeGlowSprite('255,182,213',0.4);
  const glowPurple = makeGlowSprite('201,160,255',0.4);
  const glowItem = makeGlowSprite('255,236,180',0.28);
  const glowAmbient = makeGlowSprite('255,214,235',0.4);

  // ---- lightweight synthesized sound effects (no audio files needed) ----
  let actx=null;
  function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function beep(freqStart, freqEnd, dur, type, vol){
    const ac=ensureAudio(); if(!ac) return;
    const osc=ac.createOscillator(), gain=ac.createGain();
    osc.type=type||'sine';
    osc.frequency.setValueAtTime(freqStart, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40,freqEnd), ac.currentTime+dur);
    gain.gain.setValueAtTime(vol||0.15, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime+dur);
  }
  function sfxGood(){ beep(520+Math.random()*160, 900, 0.16, 'triangle', 0.13); try{navigator.vibrate&&navigator.vibrate(8);}catch(e){} }
  function sfxBad(){ beep(220,90,0.22,'sawtooth',0.14); try{navigator.vibrate&&navigator.vibrate(35);}catch(e){} }
  function sfxOver(){ beep(300,80,0.5,'sine',0.16); }
  function sfxTap(){ beep(700,1000,0.08,'sine',0.08); }

  const GOOD=[{e:'🍔',v:5},{e:'🍕',v:5},{e:'🍦',v:8},{e:'🍩',v:6},{e:'🍟',v:4},{e:'🧁',v:7},{e:'🍎',v:3}];
  const BAD=[{e:'🥦',v:0},{e:'🦴',v:0},{e:'🌶️',v:0}];

  let running=false, score=0, lives=3, t=0, speed=1, perf=0;
  let basket, items, sparkles;

  let bokeh=[];
  function reset(){
    basket={x:W/2, y:H-56, w:78, h:36, targetX:W/2, bounce:0, blink:0, mouthOpen:0, prevX:W/2, dx:0};
    items=[]; sparkles=[]; score=0; lives=3; t=0; speed=1; perf=0;
    bokeh=[]; for(let i=0;i<10;i++) bokeh.push({x:Math.random()*W, y:Math.random()*H, r:6+Math.random()*14, sp:0.1+Math.random()*0.25, hue: Math.random()<0.5?'255,182,213':'201,160,255'});
    scoreLabel.textContent='🍔 0'; updateLives();
  }
  reset();

  function updateLives(){ livesLabel.textContent = '❤️'.repeat(Math.max(0,lives)); }

  let spawnT=0;
  function spawnItem(){
    const badChance = Math.max(0.12, Math.min(0.34, 0.2 + perf*0.012));
    const isBad = Math.random() < badChance;
    const pool = isBad ? BAD : GOOD;
    const it = pool[Math.floor(Math.random()*pool.length)];
    items.push({x: 30+Math.random()*(W-60), y:-24, vy: 1.3*speed+Math.random()*0.6, r:16, emoji:it.e, val:it.v, bad:isBad, rot:0, vr:(Math.random()-0.5)*0.1});
  }
  function burst(x,y,color,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
      sparkles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color,heart:Math.random()<0.5});
    }
  }
  function drawHeart(x,y,r){
    ctx.beginPath();
    ctx.moveTo(x,y+r*0.3);
    ctx.bezierCurveTo(x-r,y-r*0.6, x-r*0.2,y-r*1.1, x,y-r*0.3);
    ctx.bezierCurveTo(x+r*0.2,y-r*1.1, x+r,y-r*0.6, x,y+r*0.3);
    ctx.fill();
  }

  let dragging=false;
  function setTarget(clientX){
    const rect=canvas.getBoundingClientRect();
    basket.targetX = Math.max(basket.w/2, Math.min(W-basket.w/2, clientX-rect.left));
  }
  stage.addEventListener('pointerdown', e=>{ dragging=true; setTarget(e.clientX); ensureAudio(); }, {passive:true});
  window.addEventListener('pointermove', e=>{ if(dragging) setTarget(e.clientX); }, {passive:true});
  window.addEventListener('pointerup', ()=> dragging=false, {passive:true});
  const keys={};
  window.addEventListener('keydown', e=>{ keys[e.key]=true; });
  window.addEventListener('keyup', e=>{ keys[e.key]=false; });

  function update(dt){
    t+=dt;
    perf *= Math.pow(0.985, dt); // recent performance slowly fades back toward neutral
    speed = Math.max(0.8, Math.min(2.15, 1 + t/220 + perf*0.028));
    if(keys['ArrowLeft']) basket.targetX -= 5.5;
    if(keys['ArrowRight']) basket.targetX += 5.5;
    basket.targetX = Math.max(basket.w/2, Math.min(W-basket.w/2, basket.targetX));
    basket.x += (basket.targetX-basket.x)*0.25;
    basket.dx = basket.dx*0.8 + (basket.x-basket.prevX)*0.2; // smoothed velocity, drives hair/tilt motion
    basket.prevX = basket.x;

    spawnT -= dt;
    if(spawnT<=0){ spawnItem(); spawnT = 62/Math.sqrt(speed) + Math.random()*24; }

    // wider, more forgiving catch zone around the basket
    const catchHalfW = basket.w/2 + 6;
    for(let i=items.length-1;i>=0;i--){
      const it=items[i]; it.y += it.vy*dt*1.5; it.rot += it.vr*dt;
      const caught = it.y+it.r > basket.y-basket.h/2-4 && it.y-it.r < basket.y+basket.h/2 &&
                     it.x > basket.x-catchHalfW && it.x < basket.x+catchHalfW;
      if(caught){
        if(it.bad){ lives--; updateLives(); perf=Math.max(-8,perf-3); burst(it.x,it.y,'255,107,107',14); basket.bounce=1; sfxBad(); if(lives<=0){ items.splice(i,1); gameOver(); return; } }
        else { score+=it.val; perf=Math.min(9,perf+1); scoreLabel.textContent='🍔 '+score; burst(it.x,it.y,'255,158,203',12); basket.bounce=1; basket.mouthOpen=1; sfxGood(); }
        items.splice(i,1);
      } else if(it.y> H+30){
        // missing a good item is just a miss (no life lost) but nudges difficulty a little easier
        if(!it.bad) perf=Math.max(-8,perf-0.6);
        items.splice(i,1);
      }
    }
    for(let i=sparkles.length-1;i>=0;i--){
      const p=sparkles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life-=0.03;
      if(p.life<=0) sparkles.splice(i,1);
    }
    if(sparkles.length>70) sparkles.splice(0, sparkles.length-70);
    basket.bounce *= Math.pow(0.90, dt);
    if(basket.bounce<0.01) basket.bounce=0;
    basket.mouthOpen *= Math.pow(0.90, dt);
    if(basket.mouthOpen<0.01) basket.mouthOpen=0;
    basket.blink -= dt;
    if(basket.blink<=0) basket.blink = 2.5+Math.random()*2.5;

    bokeh.forEach(b=>{ b.y -= b.sp*dt; if(b.y<-20){ b.y=H+20; b.x=Math.random()*W; } });
  }

  function drawBasket(){
    // she stays still when idle; movement and catches are what animate her
    const bob = basket.bounce*-3.5;
    const sway = Math.max(-0.12, Math.min(0.12, -basket.dx*0.04));
    ctx.save();
    ctx.translate(basket.x, basket.y+bob);

    const bw=basket.w, bh=basket.h;

    // ---- basket (drawn in stable coordinates, never distorted) ----
    const bg=ctx.createLinearGradient(-bw/2,0,bw/2,bh);
    bg.addColorStop(0,'#ffb6d5'); bg.addColorStop(1,'#ffd9ec');
    ctx.fillStyle=bg; ctx.strokeStyle='#e6689f'; ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(-bw/2,2); ctx.lineTo(bw/2,2); ctx.lineTo(bw/2-8,bh); ctx.lineTo(-bw/2+8,bh); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#ff8fc4'; ctx.lineWidth=2;
    for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(i*bw/3,4); ctx.lineTo(i*bw/3*0.8,bh-4); ctx.stroke(); }
    ctx.strokeStyle='#e6689f'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.ellipse(0,2,bw/2,4,0,0,Math.PI,true); ctx.stroke();

    // ---- character group (squash/stretch isolated here, feet anchor it to the basket rim) ----
    const squish = 1 + basket.bounce*0.06;
    ctx.save();
    ctx.translate(0,-2);
    ctx.rotate(sway);
    ctx.scale(1/squish, squish);

    const headR=24, headY=-basket.h/2-50, neckY=headY+headR-4, hipY=neckY+30;
    ctx.lineJoin='round';

    // feet (peeking over the basket rim so she reads as standing inside it)
    ctx.fillStyle='#7a5a8a'; ctx.strokeStyle='#5a3a6a'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(-9,-4,6,4,0,0,7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(9,-4,6,4,0,0,7); ctx.fill(); ctx.stroke();

    // dress (single smooth trapezoid with a scalloped hem)
    const dg=ctx.createLinearGradient(0,neckY,0,hipY);
    dg.addColorStop(0,'#ffc2dd'); dg.addColorStop(1,'#ff9ecf');
    ctx.fillStyle=dg; ctx.strokeStyle='#e6689f'; ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(-14,neckY); ctx.lineTo(14,neckY);
    ctx.quadraticCurveTo(24,hipY-10,21,hipY);
    ctx.quadraticCurveTo(0,hipY+6,-21,hipY);
    ctx.quadraticCurveTo(-24,hipY-10,-14,neckY);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // little heart on the dress
    ctx.fillStyle='#ff6fa5'; drawHeart(0,neckY+14,4);

    // arms, gently swinging
    const armSwing = Math.max(-0.3,Math.min(0.3, basket.dx*0.05)) + basket.bounce*0.2;
    ctx.fillStyle='#ffd9b3'; ctx.strokeStyle='#e0a878'; ctx.lineWidth=1.5;
    [-1,1].forEach(side=>{
      ctx.save();
      ctx.translate(side*15,neckY+4);
      ctx.rotate(side*armSwing);
      ctx.beginPath(); ctx.ellipse(0,10,5,11,0,0,7); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,19,5.5,0,7); ctx.fill(); ctx.stroke();
      ctx.restore();
    });

    // back pigtails (drawn before the head so the head's hairline covers their base) — trail opposite to movement
    const tailSway = Math.max(-0.22, Math.min(0.22, -basket.dx*0.07));
    ctx.fillStyle='#b876b0'; ctx.strokeStyle='#8f5a8a'; ctx.lineWidth=2;
    [-1,1].forEach(side=>{
      ctx.beginPath();
      ctx.ellipse(side*headR*0.92, headY+headR*0.55, 9,17, side*0.32+tailSway, 0,7);
      ctx.fill(); ctx.stroke();
    });

    // head
    const hg=ctx.createRadialGradient(-8,headY-8,4,0,headY,headR+6);
    hg.addColorStop(0,'#fff1e2'); hg.addColorStop(1,'#ffdcb8');
    ctx.fillStyle=hg; ctx.strokeStyle='#e0a878'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,headY,headR,0,7); ctx.fill(); ctx.stroke();

    // hair cap covering crown + temples, one continuous shape
    ctx.fillStyle='#c584c2'; ctx.strokeStyle='#8f5a8a'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-headR*0.98, headY+headR*0.25);
    ctx.quadraticCurveTo(-headR*1.15, headY-headR*0.55, -headR*0.45, headY-headR*1.05);
    ctx.quadraticCurveTo(0, headY-headR*1.3, headR*0.45, headY-headR*1.05);
    ctx.quadraticCurveTo(headR*1.15, headY-headR*0.55, headR*0.98, headY+headR*0.25);
    ctx.quadraticCurveTo(headR*0.5, headY-headR*0.15, 0, headY-headR*0.05);
    ctx.quadraticCurveTo(-headR*0.5, headY-headR*0.15, -headR*0.98, headY+headR*0.25);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // ribbon: a proper symmetric bow centered on top of the head
    const ribbonY=headY-headR*1.02;
    ctx.fillStyle='#ff5c96'; ctx.strokeStyle='#c94f7a'; ctx.lineWidth=1.5;
    [-1,1].forEach(side=>{
      ctx.beginPath();
      ctx.moveTo(0,ribbonY);
      ctx.quadraticCurveTo(side*13,ribbonY-9, side*13,ribbonY);
      ctx.quadraticCurveTo(side*13,ribbonY+9, 0,ribbonY);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    });
    ctx.beginPath(); ctx.arc(0,ribbonY,4,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.beginPath(); ctx.ellipse(-5,ribbonY-3,3,1.6,-0.3,0,7); ctx.fill();

    // eyebrows (subtle, friendly)
    ctx.strokeStyle='#8f5a8a'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-headR*0.46,headY-headR*0.32); ctx.lineTo(-headR*0.14,headY-headR*0.36); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(headR*0.14,headY-headR*0.36); ctx.lineTo(headR*0.46,headY-headR*0.32); ctx.stroke();

    // blush
    ctx.fillStyle='rgba(255,140,180,.5)';
    ctx.beginPath(); ctx.ellipse(-headR*0.55,headY+headR*0.28,6,4,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(headR*0.55,headY+headR*0.28,6,4,0,0,7); ctx.fill();

    // eyes: big, glossy, blinking occasionally
    const blinking = basket.blink < 0.12;
    if(blinking){
      ctx.strokeStyle='#5a3a6a'; ctx.lineWidth=2.5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-headR*0.44,headY); ctx.lineTo(-headR*0.16,headY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(headR*0.16,headY); ctx.lineTo(headR*0.44,headY); ctx.stroke();
    } else {
      [-1,1].forEach(side=>{
        ctx.fillStyle='#5a3a6a';
        ctx.beginPath(); ctx.ellipse(side*headR*0.3,headY,6.5,8.5,0,0,7); ctx.fill();
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(side*headR*0.3+2.4,headY-3.4,2.2,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(side*headR*0.3-1.6,headY+2.6,1.1,0,7); ctx.fill();
      });
    }

    // mouth
    ctx.strokeStyle='#c94f7a'; ctx.fillStyle='#c94f7a'; ctx.lineWidth=2; ctx.lineCap='round';
    if(basket.mouthOpen>0.15){
      ctx.beginPath(); ctx.ellipse(0,headY+headR*0.44,5,4+basket.mouthOpen*3,0,0,7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0,headY+headR*0.3,5.5,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    }

    ctx.restore(); // character group
    ctx.restore(); // outer translate
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // soft floating bokeh for depth (cached sprites, no per-frame gradient allocation)
    bokeh.forEach(b=>{
      const spr = b.hue==='255,182,213' ? glowPink : glowPurple;
      ctx.drawImage(spr, b.x-b.r, b.y-b.r, b.r*2, b.r*2);
    });

    // soft pastel rainbow arc
    const rColors=['rgba(255,158,203,.35)','rgba(255,206,84,.3)','rgba(139,240,201,.3)','rgba(159,196,255,.3)'];
    rColors.forEach((c,i)=>{
      ctx.strokeStyle=c; ctx.lineWidth=10; ctx.beginPath();
      ctx.arc(W/2, H*0.42, W*0.62-i*12, Math.PI*1.08, Math.PI*1.92); ctx.stroke();
    });

    // dreamy pastel clouds + tiny sparkle stars
    ctx.fillStyle='rgba(255,255,255,0.85)';
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.ellipse(W*(0.2+i*0.3)+Math.sin(t*0.3+i)*6, 26, 34,15,0,0,7); ctx.fill(); }
    ctx.fillStyle='rgba(255,255,255,0.7)';
    for(let i=0;i<6;i++){
      const sx=(i*77+40)%W, sy=((i*53+t*8)%H);
      ctx.save(); ctx.translate(sx,sy); ctx.rotate(t*0.5+i);
      ctx.font='10px sans-serif'; ctx.fillText('✦',0,0);
      ctx.restore();
    }

    // soft ambient glow behind the character (cached sprite, scaled via drawImage)
    const glowR = 70 + basket.bounce*10;
    ctx.drawImage(glowAmbient, basket.x-glowR, basket.y-40-glowR, glowR*2, glowR*2);

    // ground shadow under the character
    const shadowScale = 1 - basket.bounce*0.15;
    ctx.fillStyle='rgba(150,90,140,0.18)';
    ctx.beginPath(); ctx.ellipse(basket.x, basket.y+basket.h+6, 30*shadowScale, 7*shadowScale, 0,0,7); ctx.fill();

    ctx.fillStyle='#000'; // reset to full opacity — some Android browsers tint emoji glyphs by the current fillStyle's alpha
    ctx.font='28px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    items.forEach(it=>{
      if(!it.bad){ ctx.drawImage(glowItem, it.x-15, it.y-15, 30, 30); }
      ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.rot);
      ctx.font = (it.bad? '24px':'30px')+' sans-serif';
      ctx.fillText(it.emoji,0,0);
      ctx.restore();
    });
    sparkles.forEach(p=>{
      if(p.heart){ ctx.fillStyle=`rgba(${p.color},${p.life})`; drawHeart(p.x,p.y,4); }
      else { ctx.fillStyle=`rgba(${p.color},${p.life})`; ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,7); ctx.fill(); }
    });
    drawBasket();
  }

  let last=performance.now();
  function loop(now){
    const dt=Math.min(2,(now-last)/16.67); last=now;
    if(running){ update(dt); draw(); requestAnimationFrame(loop); }
    else draw();
  }

  function gameOver(){
    running=false;
    sfxOver();
    draw();
    if(score>best){ best=score; try{localStorage.setItem('foodstorm_best',best);}catch(e){} }
    bestLabel.textContent='رکورد: '+best;
    finalScore.textContent=score; finalBest.textContent=best;
    overOverlay.style.display='flex';
  }

  function startGame(){
    reset();
    startOverlay.style.display='none'; overOverlay.style.display='none';
    hint.style.opacity='1'; hint.style.transition='';
    running=true; last=performance.now();
    requestAnimationFrame(loop);
    setTimeout(()=>{ hint.style.transition='opacity .6s'; hint.style.opacity='0'; },2400);
  }

  document.getElementById('startBtn').addEventListener('click', ()=>{ sfxTap(); startGame(); });
  document.getElementById('retryBtn').addEventListener('click', ()=>{ sfxTap(); startGame(); });
  document.getElementById('shareBtn').addEventListener('click', ()=>{
    const text = `🍔⛈️ Food Storm Catch\nامتیازم: ${score} | رکورد: ${best}\nبیا ببین می‌تونی از من بهتر غذا بگیری یا نه!`;
    if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(()=>{
        copiedToast.classList.add('show'); setTimeout(()=>copiedToast.classList.remove('show'),1600);
      });
    }
  });

  draw();
})();
</script>
</body>
</html>
